# Orvena project config. Behavior is driven by these files (config-first) —
# edit them to adapt Orvena to your project; no code changes required.
#
# `orvena init` sets `provider` for you after you pick one. There is no silent
# default: if the key for your provider is missing, `orvena doctor` tells you.

provider:
  kind: anthropic          # anthropic | openai | openrouter | ollama | openai_compat | offline
  model: claude-opus-4-8   # a model your chosen provider serves
  # base_url:              # optional endpoint override; REQUIRED for openai_compat
  # api_key_env:           # openai_compat only: env var holding the key (e.g.
  #                        # GROQ_API_KEY); omit if the endpoint needs no key

# Governance tier (discipline scales with risk):
#   light       — scope lock & gates are advisory: an in-root scope-lock or gate
#                 violation is recorded and the loop continues (it does not halt
#                 the run).
#   engineering — scope lock & gates are hard-enforced: a violation halts the run.
# Independent of tier: a write whose path escapes the project root (via `..` or a
# symlink) is ALWAYS refused by the fs tool — never written — even under `light`.
tier: light

default_role: developer

# Upper bound on loop attempts (bounded autonomy).
max_steps: 3

# OS-level sandbox for every command Orvena spawns — the `<<<RUN>>>` commands and
# each gate's `verify` (ADR-003). This is the OS-enforced floor UNDER `intent`:
# `intent` decides whether the model may *trigger* a command; the sandbox decides
# what a triggered command can *do*. A command that claims read_only but tries to
# write outside this project or open the network is stopped by the OS, not merely
# trusted.
#
# Platform support in this release: macOS (via `sandbox-exec`) is enforced.
# Linux/other report "unavailable" for now, and then follow `on_unavailable`.
sandbox:
  enabled: true

  # network: deny | allow. `deny` blocks outbound connections from spawned
  # children. NOTE: the first `cargo build` / `npm install` needs the network to
  # fetch dependencies — set `allow`, or vendor your deps, for commands that must
  # reach a registry. Offline-by-default is intentional (reproducible + no exfil).
  network: deny

  # filesystem: root_write | strict.
  #   root_write — writable = this project directory (+ system temp). Zero
  #                friction: builds/tests write `target/`, `node_modules/`, etc.
  #   strict     — writable = only `strict_writable` below (+ system temp).
  filesystem: root_write
  # strict_writable:            # used only when filesystem: strict
  #   - target
  #   - node_modules

  # on_unavailable: fail_closed | warn — what to do when the OS sandbox mechanism
  # is not available on this host (e.g. Linux until the Landlock backend ships).
  # Omit to derive from `tier`: engineering → fail_closed (refuse to run children
  # unconfined), light → warn (run unconfined, but record the degradation).
  # on_unavailable: fail_closed
