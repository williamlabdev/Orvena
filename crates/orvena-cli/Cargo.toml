[package]
name = "orvena-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Orvena CLI — a thin frontend over orvena-core."

[[bin]]
name = "orvena"
path = "src/main.rs"

[dependencies]
orvena-core = { path = "../orvena-core" }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_yaml.workspace = true
# Only for asking whether we are the terminal's foreground process group before
# prompting — see `init::can_prompt`.
libc = "0.2"

[dev-dependencies]
# Evidence bundles are read back as raw JSON in tests — deliberately not through
# the `RunReport` derive, whose defaults would repair a bundle missing a field.
serde_json.workspace = true
