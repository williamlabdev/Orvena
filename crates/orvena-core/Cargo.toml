[package]
name = "orvena-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for Orvena — a config-first, governed, measurable coding agent. All logic lives here so it can be embedded by a larger AI runtime."

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
regex.workspace = true
ignore.workspace = true
wait-timeout.workspace = true

# OS sandbox — Linux backend only (ADR-003 / slice-016). Landlock confines the
# filesystem, seccompiler denies AF_INET/AF_INET6 sockets; both are pure Rust
# (no C toolchain), so they cross-compile cleanly. macOS uses `sandbox-exec` and
# pulls none of these.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.4"
libc = "0.2"

[dev-dependencies]
jsonschema = "0.26"
