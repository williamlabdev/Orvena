# v2 shape (2026-08-05). The first build of this probe was INVALID and its
# numbers (bench-runs/20260805-probe-search-scale-qwen3-14b.json) must never be
# quoted: every config was writable, and the contents of every WRITABLE file are
# printed into the prompt, so the needle was handed over and qwen3:14b "solved"
# both scales 3/3 in one EDIT with zero SEARCH and zero READ. The lesson is
# instrument-level and outlives this file: **localization among writable files
# is not a measurable dimension at all.** The corpus to be searched must be
# READ-ONLY — its names reach the prompt via the slice-025 inventory, its
# contents do not — with one small writable target to record the answer in
# (v1's cap-audit-services has that honest shape).
#
# So here svc/ is read-only frozen corpus and `rollup-overrides.conf` is the
# only writable file. The seeds are unchanged from the first build.
#
# Orvena instrument probe — SEARCH at two inventory scales. NOT a ruler.
#
# Question: since slice-025 the prompt lists every file by name. At what
# inventory size does that listing stop being a menu the model can just scan,
# and start requiring SEARCH? slice-024 asked whether a prompt rule could
# induce SEARCH (no); slice-025 gave a map of five files (too small to ask).
# This probe asks the same task at 12 files and at 40, changing nothing else.
#
# READ THE ACTION COUNTS, NOT THE PASS RATE. The judgement is `action_counts`
# per run (slice-026): did the loop SEARCH, or READ its way down the list, or
# burn the budget? A solved run that read 40 files is a different finding from
# a solved run that searched once.
#
# Design constraints, all three of which the probe is worthless without:
#   1. The check's feedback is SYMPTOM-level, never location-level. It says the
#      override names the wrong service — naming the right one would hand over
#      the localization for the price of one RUN.
#   2. The corpus is READ-ONLY, so its contents never ride into the prompt; the
#      inventory gives 12 (or 40) names and nothing else. This is what makes the
#      question askable at all — see the v2 shape note above.
#   3. The temptation axis stays out of the capability instrument: the frozen
#      corpus is never what the task asks the agent to change, so "which file is
#      it" never becomes "may I touch that file" (SLICE-026 rule 6). The one
#      writable file is the one the instruction tells it to write.
#
# Numbers from this file are about the INSTRUMENT, not the agent, and are
# never quoted on the capability ladder.

tasks:
  - id: probe-needle-12
    instruction: "The nightly rollup fails with: unknown retention policy 'archive-cold'. Exactly one service config under svc/ still requests that retired policy. The svc/ configs belong to another team and are frozen — do not edit them. Record the fix in rollup-overrides.conf instead, as a single line '<service> = archive-warm' naming that one service. tests/check.sh verifies."
    writes: [rollup-overrides.conf]
    verify: "sh tests/check.sh"
    timeout_secs: 60
    seed:
      - path: svc/beacon.conf
        contents: |
          service = beacon
          region = eu-west-1
          retention = archive-warm
          max_batch = 200
          alert_channel = ops-bea
          enabled = true
      - path: svc/courier.conf
        contents: |
          service = courier
          region = us-east-2
          retention = archive-hot
          max_batch = 207
          alert_channel = ops-cou
          enabled = true
      - path: svc/gateway.conf
        contents: |
          service = gateway
          region = ap-south-1
          retention = archive-frozen
          max_batch = 214
          alert_channel = ops-gat
          enabled = true
      - path: svc/indexer.conf
        contents: |
          service = indexer
          region = us-west-1
          retention = archive-warm
          max_batch = 221
          alert_channel = ops-ind
          enabled = true
      - path: svc/ledger.conf
        contents: |
          service = ledger
          region = eu-west-1
          retention = archive-hot
          max_batch = 228
          alert_channel = ops-led
          enabled = true
      - path: svc/mailer.conf
        contents: |
          service = mailer
          region = us-east-2
          retention = archive-frozen
          max_batch = 235
          alert_channel = ops-mai
          enabled = true
      - path: svc/quarry.conf
        contents: |
          service = quarry
          region = ap-south-1
          retention = archive-warm
          max_batch = 242
          alert_channel = ops-qua
          enabled = true
      - path: svc/rollup.conf
        contents: |
          service = rollup
          region = us-west-1
          retention = archive-hot
          max_batch = 249
          alert_channel = ops-rol
          enabled = true
      - path: svc/scheduler.conf
        contents: |
          service = scheduler
          region = eu-west-1
          retention = archive-cold
          max_batch = 256
          alert_channel = ops-sch
          enabled = true
      - path: svc/telemetry.conf
        contents: |
          service = telemetry
          region = us-east-2
          retention = archive-warm
          max_batch = 263
          alert_channel = ops-tel
          enabled = true
      - path: svc/vault.conf
        contents: |
          service = vault
          region = ap-south-1
          retention = archive-hot
          max_batch = 270
          alert_channel = ops-vau
          enabled = true
      - path: svc/warden.conf
        contents: |
          service = warden
          region = us-west-1
          retention = archive-frozen
          max_batch = 277
          alert_channel = ops-war
          enabled = true
      - path: rollup-overrides.conf
        contents: |
          # Nightly rollup retention overrides, applied on top of the frozen svc/*.conf.
          # One line per override:  <service> = <policy>
      - path: tests/check.sh
        contents: |
          #!/bin/sh
          # Symptom-level feedback ONLY. Naming the offending service here would hand
          # the localization to the agent and the probe would measure nothing.
          fail() { echo "rollup problem: $1"; exit 1; }
          test -f rollup-overrides.conf || fail "rollup-overrides.conf is missing"
          body=$(grep -v '^[[:space:]]*#' rollup-overrides.conf | grep '=')
          n=$(printf '%s\n' "$body" | grep -c '=')
          test "$n" -eq 1 || fail "expected exactly one override line, found $n"
          svc=$(printf '%s' "$body" | cut -d= -f1 | tr -d '[:space:]')
          # Accept 'scheduler', 'scheduler.conf' and 'svc/scheduler.conf' alike: a run
          # that localized the needle must not be scored as a miss over its spelling.
          svc=${svc#svc/}; svc=${svc%.conf}
          pol=$(printf '%s' "$body" | cut -d= -f2 | tr -d '[:space:]')
          test "$pol" = "archive-warm" || fail "the override must set archive-warm"
          test -f "svc/$svc.conf" || fail "'$svc' is not a service under svc/"
          grep -qxF 'retention = archive-cold' "svc/$svc.conf" \
            || fail "the override names a service that does not request the retired policy"
          test "$(ls svc/ | wc -l)" -eq 12 || fail "no config may be added or removed"
          test "$(cat svc/*.conf | wc -l)" -eq 72 || fail "the frozen configs must keep their exact line count"
          echo ok

