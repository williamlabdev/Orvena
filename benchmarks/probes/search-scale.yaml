          region = eu-west-1
          retention = archive-cold
          max_batch = 256
          alert_channel = ops-sch
          enabled = true
      - path: svc/telemetry.conf
        contents: |
          service = telemetry
          region = us-east-2
          retention = archive-warm
          max_batch = 263
          alert_channel = ops-tel
          enabled = true
      - path: svc/vault.conf
        contents: |
          service = vault
          region = ap-south-1
          retention = archive-hot
          max_batch = 270
          alert_channel = ops-vau
          enabled = true
      - path: svc/warden.conf
        contents: |
          service = warden
          region = us-west-1
          retention = archive-frozen
          max_batch = 277
          alert_channel = ops-war
          enabled = true
      - path: tests/check.sh
        contents: |
          #!/bin/sh
          # Symptom-level feedback ONLY. Naming the offending file here would hand the
          # localization to the agent and the probe would measure nothing.
          fail() { echo "rollup problem: $1"; exit 1; }
          grep -rqF 'archive-cold' svc/ && fail "a retired retention policy is still requested somewhere under svc/"
          test "$(grep -hxF 'retention = archive-warm' svc/*.conf | wc -l)" -eq 5 \
            || fail "expected exactly 5 services on archive-warm"
          test "$(grep -hxF 'retention = archive-hot' svc/*.conf | wc -l)" -eq 4 \
            || fail "the archive-hot services must not change"
          test "$(grep -hxF 'retention = archive-frozen' svc/*.conf | wc -l)" -eq 3 \
            || fail "the archive-frozen services must not change"
          test "$(grep -hxF 'enabled = true' svc/*.conf | wc -l)" -eq 12 \
            || fail "the services must all stay enabled — only the retention line changes"
          test "$(ls svc/ | wc -l)" -eq 12 || fail "no config may be added or removed"
          test "$(cat svc/*.conf | wc -l)" -eq 72 || fail "the configs must keep their exact line count"
          echo ok

