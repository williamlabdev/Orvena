# ⚠️  INVALID AS BUILT (2026-08-05, first run) — DO NOT QUOTE ITS NUMBERS.
# qwen3:14b solved both scales 3/3 in ONE step with a single EDIT and zero
# SEARCH, zero READ. Not a finding about the model: constraint 2 below (every
# config writable, to keep temptation out) collides with how context is
# assembled — the contents of every WRITABLE file are printed into the prompt.
# The needle was handed over, so nothing was ever localized. General lesson for
# the v2 set: "localization among writable files" is not a measurable dimension
# at all; the corpus to be searched must be READ-ONLY (v1's cap-audit-services
# has the honest shape — registry read-only, one small writable target).
# Fix before re-running: keep svc/ read-only and give the task a separate
# writable target. The seeds below are reusable as-is.
#
# Orvena instrument probe — SEARCH at two inventory scales. NOT a ruler.
#
# Question: since slice-025 the prompt lists every file by name. At what
# inventory size does that listing stop being a menu the model can just scan,
# and start requiring SEARCH? slice-024 asked whether a prompt rule could
# induce SEARCH (no); slice-025 gave a map of five files (too small to ask).
# This probe asks the same task at 12 files and at 40, changing nothing else.
#
# READ THE ACTION COUNTS, NOT THE PASS RATE. The judgement is `action_counts`
# per run (slice-026): did the loop SEARCH, or READ its way down the list, or
# burn the budget? A solved run that read 40 files is a different finding from
# a solved run that searched once.
#
# Design constraints, both of which the probe is worthless without:
#   1. The check's feedback is SYMPTOM-level, never location-level. It says a
#      retired policy is requested "somewhere under svc/" — naming the file
#      would hand over the localization for the price of one RUN.
#   2. Every config is writable. The temptation axis stays out of the
#      capability instrument: "which file is it" must never become "may I
#      touch that file" (see SLICE-026-capability-set-v2.md, rule 6).
#
# Numbers from this file are about the INSTRUMENT, not the agent, and are
# never quoted on the capability ladder.

tasks:
  - id: probe-needle-12
    instruction: "The nightly rollup fails with: unknown retention policy 'archive-cold'. Exactly one service config still requests that retired policy; switch it to archive-warm. Nothing else may change. tests/check.sh verifies."
    writes: [svc/beacon.conf, svc/courier.conf, svc/gateway.conf, svc/indexer.conf, svc/ledger.conf, svc/mailer.conf, svc/quarry.conf, svc/rollup.conf, svc/scheduler.conf, svc/telemetry.conf, svc/vault.conf, svc/warden.conf]
    verify: "sh tests/check.sh"
    timeout_secs: 60
    seed:
      - path: svc/beacon.conf
        contents: |
          service = beacon
          region = eu-west-1
          retention = archive-warm
          max_batch = 200
          alert_channel = ops-bea
          enabled = true
      - path: svc/courier.conf
