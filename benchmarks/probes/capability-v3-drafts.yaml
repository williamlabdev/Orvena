  # ══ N3 — convergence + fat state (capv3-converge-fatref) ═════════════════
  #
  # Shape: H deepened. Each lane is a SUBTRACTION — the value ending a pool
  # file's last line minus the value ending refs/matrix.txt's last line —
  # so the matrix term is re-needed in EVERY round, and the round's other
  # fat read evicts it (asserted: m+p1+edit fits; +p_j exceeds; the re-read
  # round fits again). Round 2's pool file is armored: p2 vs p3 selected by
  # cksum(lane_a's correct value) at runtime.
  #
  # MERGE NOTE (draft-5): draft-4's N3 (row-keyed chain inside one matrix +
  # a fat static audit dump on every gate fail) died twice over in the 0807
  # collision review. The row keys fall to condition 14 (SEARCH fetches a
  # named row for ~32 tokens). The audit dump is structurally incompatible
  # with the merged pairwise need: gate output rides on EVERY step's block,
  # so fat-gate + two coexisting fat reads can never fit 4096 and the task
  # would break condition 9 outright. The eviction source in draft-5 is the
  # pair itself; the subtraction is what makes the pair necessary (a lane
  # value that is a bare tail copy would let the constant matrix term be
  # carried in the writable file for free after round 1).
  #
  # Why the answer is not searchable at all: lane values exist in NO file —
  # they are differences. And the terms are positional (condition 14).
  #
  # Arithmetic watch item (probe, not a flag): a lane is a 4-digit
  # subtraction done by the model. An arithmetic slip and an invented value
  # both die as wrong-value complaints; the behavior probe must separate
  # them from the action log (a slip follows fresh reads of both terms —
  # both tails in-window at the edit; invention edits with a term missing
  # from the window).
  #
  # Condition 9: honest walk = R matrix, R p1, E, R p_j, R matrix, E = 6
  # actions, slack 2.
  #
  # Condition 11 self-test:
  #   batch walk: s1 READ matrix+p1+p2+p3+check.sh (> 4096, dropped whole
  #     once anything lands after it). Close at s2? NO — the round-2 pool
  #     file hangs off lane_a's correct value via cksum; s2 can fix lane_a
  #     (both terms readable in the giant newest block) but lane_b's file
  #     is unknowable until the reveal, and by then the giant is evicted.
  #   compute-channel walk: none — RUN is fixed-argv only (tools/shell.rs);
  #     cksum cannot be run on chosen input.
  #   search walk: both terms are last-line positional; a difference
  #     appears in no file.
  #   stash walk: placeholders are answer-width (4 digits), cap = solved
  #     size + 4B, guards precede the lane checks — insertion preempts the
  #     reveal. The necessary evidence is two ~7.1KB files that no 4-char
  #     field can carry.
  #
  # Expected deaths: the 0.5.0 H-14b family signature — edit streak with
  # zero go-backs ("still editing" is not "re-reading"), budget_exhausted;
  # dropped_reread + dropped_research together separate ordering-death from
  # reread-death (SEARCH recovery no longer reads as invention).

  - id: capv3-converge-fatref
    instruction: "tests/check.sh rejects limits.conf but reports only the FIRST problem each time it runs. Reference data lives under refs/ (read-only). Fix limits.conf until the check passes. Lines it does not complain about must stay unchanged."
    writes: [limits.conf]
    verify: "sh tests/check.sh"
    timeout_secs: 30
    seed:
      - path: limits.conf
        contents: |
          # capacity limits — planner input
          lane_a = ----
          lane_b = ----
          guard = fixed
      - path: tests/check.sh
        contents: |
          #!/bin/sh
          f=limits.conf
          fail() { echo "limits problem: $1"; exit 1; }
          test "$(wc -c < "$f" | tr -d ' ')" -le 82 || fail "limits.conf must stay under 82 bytes"
          test "$(wc -l < "$f" | tr -d ' ')" = "4" || fail "limits.conf must stay exactly 4 lines"
          grep -qxF '# capacity limits — planner input' "$f" || fail "an unrelated line changed: header"
          grep -qxF 'guard = fixed' "$f" || fail "an unrelated line changed: guard"
          m=$(tail -n 1 refs/matrix.txt | awk '{print $NF}')
          a=$(tail -n 1 refs/p1.txt | awk '{print $NF}')
          got=$(sed -n 's/^lane_a = //p' "$f")
          test "$got" = "$((a - m))" || fail "lane_a must equal the value ending the LAST line of refs/p1.txt minus the value ending the LAST line of refs/matrix.txt"
          n=$(printf %s "$got" | cksum | awk '{print $1 % 2 + 2}')
          b=$(tail -n 1 "refs/p$n.txt" | awk '{print $NF}')
          got=$(sed -n 's/^lane_b = //p' "$f")
          test "$got" = "$((b - m))" || fail "lane_b must equal the value ending the LAST line of refs/p$n.txt minus the value ending the LAST line of refs/matrix.txt"
          echo ok
