# Orvena capability v3 DRAFTS — window-management axis. NOT a ruler.
#
# Status: DRAFT (0807) — pre-probe, pre-freeze. Design: SLICE-032 (ratified
# 0807, four rulings). These are the N1/N3/N4 shapes from the type table;
# N2's shape is separately locked by ruling iii (header-signal probe, 6/6)
# and is not drafted here. Numbers from these tasks never enter any official
# account; the probe protocol below must pass before any freeze talk.
#
# What every task here shares (mechanism dossier, verified in code 0807):
#
# * Sequential first-problem-only check (H pattern): reveal k+1 exists only
#   after fix k — real state dependency, per design condition 11.
# * ARMOR CHAIN (new in v3, needs review): the slot key for round k+1 is
#   derived from the CORRECT value of field k via `cksum` — key = crc % 97+1.
#   Why: condition 11's literal self-test ("batch model reads the whole
#   corpus incl. tests/check.sh at step 1 — can it close at step 2?") kills
#   every plaintext-mapping design: reading check.sh reveals the full
#   field↔slot map, and the step-1 giant block is still the newest block at
#   step 2 (newest-block exemption), so a one-shot full write closes at
#   step 2 with zero window pressure. v2-H has exactly this property. With
#   the armor, the mapping is not mentally recoverable (CRC is not text
#   reasoning), and no compute channel exists: RUN executes only
#   pre-declared fixed-argv commands (.orvena/commands.yaml, tools/
#   shell.rs) — the model cannot hand cksum any input. Keys are unknowable
#   until each reveal, and reveals only follow real fixes. Honest walkers
#   never see the armor: each complaint names the key in plaintext at
#   runtime. N1's round-4 pin key is armored for the same reason (see the
#   pre-fill walk in its block).
# * Anti-stash guards: placeholders are the same width (12 chars) as
#   every answer and the byte cap is the exact solved size + 4B, plus
#   exact line count + grep -qxF frozen lines — ALL ordered BEFORE the
#   chain checks, so honest walks are size-constant and any insertion
#   preempts the next round reveal. Writable contents print into the
#   prompt each step (context.rs:56-73) outside the 4096 evidence budget,
#   and the 8000 whole-prompt budget does NOT self-limit a stash
#   (system+head ≈ 600 tok leaves ~7.4k of print room — the verifier
#   refuted draft-1's self-blinding claim, incl. a zero-cost pack into a
#   not-yet-checked field line). What actually closes the hole is gate
#   ordering: a stashed file trips a guard, and a guard complaint
#   preempts every round reveal — stash and progress are mutually
#   exclusive, so stash/unstash cycles cost 2 edits per round against
#   1 JIT re-read. Strictly dominated; probes still watch for it.
# * Complaints POINT at the source and never quote the expected literal
#   (L-forensics 0807: quoted literals in feedback became the wrong answer;
#   freshness traps are a DIFFERENT axis and must not contaminate these).
# * Fat refs are 98 lines / ~7.7KB ≈ 1950 tokens — deliberately under the
#   READ/RUN truncation edge (100 lines / 8KB, cap_run_output), so one READ
#   returns the whole file untruncated.
# * Adversarial review trail (0807): round 1 — verifier refuted two
#   draft-1 claims (print-budget self-blinding: false arithmetic;
#   "RUN-simulator walk": the channel does not exist, RUN is fixed-argv);
#   draft-3 added byte-cap guards and armored N1's round-4 key after the
#   pre-fill walk was found. Round 2 — verifier executed a live stash
#   walk through draft-3's N1 cap (five pin values in a not-yet-checked
#   field, 7 actions, zero dropped_reread); draft-4 answers with
#   answer-width placeholders + solved-size+4 caps, and the exact walk
#   is now a regression test in the generator. Residue: the 1-in-4
#   single-candidate pre-fill guess (see N1 block) is irreducible.
# * All seeds, chains and complaint sequences are generated and MECHANICALLY
#   verified by benchmarks/probes/v3-draft-gen/gen_v3_drafts.py: honest walk applied fix-by-fix,
#   complaint order asserted exact, final check asserted `ok`.
#
# Probe protocol before any freeze (SLICE-032 calibration section):
#   (i)  token-shape probe: real run per task; require window_peak_tokens
#        near 4096 and evictions.first_step > 0 for N1/N3 (pressure real);
#        if no eviction shows, fatten refs toward the truncation edge.
#   (ii) behavior probe: small n, both cells; death signatures must land in
#        the type-table classes (dropped_reread separates ordering-death
#        from reread-death). Watch items are listed per task below.
#   Telemetry caveat for (ii): dropped_reread counts repeat READs of
#   evicted paths — a model that re-fetches via SEARCH/grep instead of READ
#   may not count; classify from action logs if the counter reads zero.
#
# Open flags for ruling (none block probing):
#   f1. The armor chain is a new mechanism — CTR/fresh-eyes should attack
#       it before freeze (is a runtime-computed slot key still "information
#       structure", per condition 10? The values remain read-to-know; the
#       armor only hides the MAP, never a value).
#   f2. N1's honest worst case is exactly 8 actions — zero slack; one
#       exploratory read (ls, check.sh) costs the run. That IS the
#       read-restraint axis, but the behavior probe must confirm it
#       doesn't just measure step-arithmetic luck.
#   f3. N4's necessary-evidence total is 3 x ~1975 ≈ 5930 tok ≈ 1.45x4096,
#       under the ruled 1.5–2x band: the READ truncation cap (2048/read)
#       bounds what one fat ref can carry, and a 4th ref pushes the
#       with-retention honest walk to 9 actions, breaking condition 9.
#       Either accept 1.45x or rule a shape change.

tasks:
  # ══ N1 — ordering / reread decision (capv3-pin-eviction) ═════════════════
  #
  # Shape: the pin file (notes/s9.txt, small, five entries k1..k9) is needed
  # at round 1 (k1) AND round 4 — where WHICH entry (k3/k5/k7/k9) is itself
  # armored, derived at runtime from fallback's correct value. Rounds 2–3
  # each force one fat read (inv-a, inv-b). By round 4 the pin block has
  # been squeezed out — the pass behavior is a second READ of the pin after
  # the dropped marker (dropped_reread >= 1).
  #
  # Why round 4 is armored too (pre-fill walk, found in draft-2 self-test):
  # with a plaintext `rollback ↔ k9` mapping in check.sh, a check-reading
  # batch model pre-fills rollback at s2 while the giant is still the
  # newest block, and passes in 6 steps with ZERO needle re-read — the
  # construct dissolves. With the key runtime-derived, no walk knows which
  # pin entry matters until the round-4 complaint, by which time the pin
  # is out of the window.
  #
  # Pressure arithmetic (estimate_tokens = ceil(chars/4)):
  #   sequential walk blocks: s1 pin+gate ~120 | s2 edit ~120 | s3 inv-a
  #   ~2000 | s4 edit ~120 | s5 inv-b ~2000 | s6 edit ~120. At s7 the
  #   window walks back s6+s5+s4+s3 ≈ 4240 > 4096 → s1/s2 (the pin) are
  #   out, dropped marker shown. Margin is thin (~150 tok) — token-shape
  #   probe MUST confirm evictions.first_step <= 7; if not, fatten refs.
  #
  # Condition 9: honest worst case = R pin, E, R inv-a, E, R inv-b, E,
  # R pin, E = 8 actions exactly (zero slack — flag f2). Best honest case
  # 7 (pin survives; probe should NOT see that if pressure is right).
  #
  # Condition 11 self-test (all walks written out):
  #   batch walk: s1 READ pin+inv-a+inv-b+check.sh (gate reveals round-1
  #     complaint into the same block). Close at s2? NO — mirror/fallback
  #     slots and the round-4 pin key are cksum-armored; check.sh gives
  #     the rule, never the keys. s2 can only fix `release`.
  #   compute-channel walk: RUN executes only pre-declared fixed-argv
  #     commands (.orvena/commands.yaml via tools/shell.rs — the model
  #     cannot pass arguments), so cksum cannot be executed on any chosen
  #     input; CRC is not text reasoning either. The chain cannot be
  #     precomputed at any step, by any route.
  #   stash walk (killed twice, now mechanically regression-tested):
  #     writable contents print into the prompt each step outside the
  #     evidence budget (context.rs:56-73); the 8000 print budget does
  #     NOT self-limit a stash (verifier, round 1). Draft-3's 300B cap
  #     still left ~164B of real headroom — enough for all five pin
  #     values (~85B) packed into the not-yet-checked rollback field:
  #     7 actions, zero pin re-read, dropped_reread never fires
  #     (verifier, round 2, executed against the real check). Draft-4
  #     closes the WIDTH: placeholders are the same 12 chars as every
  #     answer, and the cap is the solved size + 4B, so every honest
  #     state is size-constant and any insertion trips the guard —
  #     which runs before the chain, so a stashed file never receives
  #     a round reveal. Because the chain re-verifies from the top on
  #     every run, already-fixed fields cannot be shrunk to free bytes
  #     without forfeiting the reveal; the only stash room left at
  #     round 4 is rollback's own 12 chars = a single-candidate
  #     pre-fill guess at 1-in-4 odds. That residue is irreducible
  #     (guessing into the answer slot can never be capped away);
  #     probe: a no-reread pass is a coin-flip signature, expect ~25%
  #     of such runs, classify separately.
  #
  # Expected deaths: fabricated round-4 value (grounding rule catches →
  # burned steps); edit-without-reread after the dropped marker; batch
  # cliff followed by full re-read burn (steps exhaust).

  - id: capv3-pin-eviction
    instruction: "tests/check.sh rejects deploy.conf but reports only the FIRST problem each time it runs. Reference data lives under notes/ and refs/ (read-only). Fix deploy.conf until the check passes. Lines it does not complain about must stay unchanged."
    writes: [deploy.conf]
    verify: "sh tests/check.sh"
    timeout_secs: 30
    seed:
      - path: deploy.conf
        contents: |
          # staging deploy manifest
          release = ------------
          mirror = ------------
          fallback = ------------
          rollback = ------------
          owner = platform
