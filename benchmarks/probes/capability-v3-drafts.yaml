# Orvena capability v3 DRAFTS — window-management axis. NOT a ruler.
#
# Status: DRAFT-5 (0807, the MERGE) — pre-probe, pre-freeze. Design:
# SLICE-032 (ratified 0807, four rulings). These are the N1/N3/N4 shapes
# from the type table; N2's shape is separately locked by ruling iii
# (header-signal probe, 6/6) and is not drafted here. Numbers from these
# tasks never enter any official account; the probe protocol below must
# pass before any freeze talk.
#
# PROVENANCE — the 0807 draft collision and its ruling:
# Two sessions drafted v3 in parallel. draft-4 (0eba93c: armor chain,
# anti-stash width guards, reviewed by verifier x2) and the alt draft
# (9b91b4b: uniform/positional corpora, span sentinel). Each refuted one
# load-bearing claim of the other:
#   * draft-4's hole: complaints named row keys and rows led with them —
#     `SEARCH <key>` fetches any fat value for ~32 tokens vs a ~2000-token
#     READ; the window pressure all three tasks stand on evaporates.
#   * alt's hole: tests/check.sh is readable corpus; with a plaintext
#     field↔source map its condition-11 case collapses, and its N4 format
#     gate (unbounded [0-9]+) admits a min·max concat stash through the
#     writable-reprint channel — the sentinel walks in 6 actions.
# Ruling (0807 late): merge with draft-4 as the base, the alt corpus form
# swapped in, N4 recast as the span sentinel. draft-5 is that merge; each
# draft's surviving mechanism closes the other's hole.
#
# What every task here shares (mechanism dossier, verified in code 0807):
#
# * Sequential first-problem-only check (H pattern): reveal k+1 exists only
#   after fix k — real state dependency, per design condition 11.
# * UNIFORM / POSITIONAL CORPORA (condition 14, from the alt draft): fat
#   records are fixed-shape, every record ends in a same-shape value, and
#   the operative value is the file's LAST line, and the records are
#   DE-ANCHORED (fresh-eyes round 3): no index column, per-row fields
#   random, sibling row counts pairwise distinct. SEARCH matches content
#   and content does not encode position; a hit's path:line: number
#   cannot be certified as an unread file's last line; the only certain
#   selector for a tail is the tail itself, which presupposes the read;
#   a catch-all sweep renders dearer than the READ (all four properties
#   asserted by the generator's deanchored() regression; MAX_HITS=200
#   additionally caps multi-file sweeps). N1's pin file is the deliberate
#   exemption (see its block: the needle is SUPPOSED to be cheap to
#   re-acquire; the go-back is the measurement).
# * ARMOR CHAIN (from draft-4, now file-level): which pool file (N1, N3)
#   or which pin key (N1 round 4) settles round k+1 is derived from the
#   CORRECT value of field k via `cksum` at runtime. Why: condition 11's
#   literal self-test kills every plaintext-mapping design — reading
#   check.sh reveals the full map, and the step-1 giant block is still the
#   newest block at step 2 (newest-block exemption), so a one-shot full
#   write closes at step 2 with zero window pressure (v2-H has exactly
#   this property). With the armor the map is not mentally recoverable
#   (CRC is not text reasoning) and no compute channel exists: RUN
#   executes only pre-declared fixed-argv commands (.orvena/commands.yaml,
#   tools/shell.rs). Keys are unknowable until each reveal, and reveals
#   only follow real fixes. Honest walkers never see the armor: each
#   complaint names the file/key in plaintext at runtime.
# * Anti-stash guards (from draft-4): placeholders are answer-width, the
#   byte cap is the exact solved size + 4B, exact line count + grep -qxF
#   frozen lines — ALL ordered BEFORE the chain checks, so honest walks
#   are size-constant and any insertion preempts the next round reveal.
#   Writable contents print into the prompt each step (context.rs:56-73)
#   outside the 4096 evidence budget, and the 8000 whole-prompt budget
#   does NOT self-limit a stash — gate ordering is what closes the hole:
#   stash and progress are mutually exclusive. N4 adds a {1,4} digit
#   width gate for the same reason (the pair-carry stash).
# * Complaints POINT at the source and never quote the expected literal
#   (L-forensics 0807: quoted literals in feedback became the wrong
#   answer; freshness traps are a DIFFERENT axis and must not contaminate
#   these).
# * Fat refs are deliberately under the READ/RUN truncation edge (100
#   lines / 8KB, cap_run_output), so one READ returns the whole file
#   untruncated: N1 pool 97-99 lines / ~8KB ≈ 1990-2030 tok; N3/N4 refs
#   81-84 lines / ~6.9-7.1KB ≈ 1720-1790 tok (counts pairwise distinct
#   per family — part of the de-anchoring).
# * Adversarial review trail: draft-1→4 (verifier x2: print-budget
#   self-blinding refuted; RUN-simulator channel nonexistent; live stash
#   walk through draft-3's cap → answer-width placeholders + solved+4
#   caps, stash walk now a generator regression test). draft-4→5 (the
#   collision review above; the SEARCH-cost bypass and the concat stash
#   are both closed and both regression-tested). draft-5 round 3 (the
#   ruled B2 zero-context attack): REFUTED the first draft-5 — the
#   slot-#### index column was itself a cross-file positional anchor
#   (read one sibling, SEARCH the known last index in the others,
#   17-60x cheaper than the READ; the same class of hole the collision
#   killed draft-4 over, in new clothes). Fixed by de-anchoring (above)
#   + the deanchored() generator regression + explicit >=1000 value
#   invariants (leading-zero shell hazard flagged in the same round).
#   Residue: N1's 1-in-4 single-candidate pre-fill guess is irreducible;
#   N4's residual walks are documented in its block and asserted by the
#   generator.
# * All seeds, armor selections and complaint sequences are generated and
#   MECHANICALLY verified by benchmarks/probes/v3-draft-gen/
#   gen_v3_drafts.py: honest walk applied fix-by-fix, complaint order
#   asserted exact, final check asserted `ok`, window arithmetic asserted
#   against the agent estimator (ceil(chars/4)), corpus uniformity
#   asserted, stash/shortcut walks regression-tested.
#
# Telemetry: death classification uses the SLICE-032 instrument
# (evictions / dropped_reread / dropped_research / window_peak_tokens).
# The 0807 instrument gap is CLOSED (42e59da): dropped_research counts
# SEARCH re-acquisition of an evicted path, so a go-back by the route the
# READ truncation note recommends no longer scores as invention.
#
# Probe protocol before any freeze (SLICE-032 calibration section):
#   (i)  token-shape probe: real run per task; require window_peak_tokens
#        near 4096 and evictions.first_step > 0 for N1/N3 (pressure
#        real); if no eviction shows, fatten refs toward the truncation
#        edge (N1 is already at 99 lines — the remaining slack is bytes,
#        not lines).
#   (ii) behavior probe: small n, both cells; death signatures must land
#        in the type-table classes. Per-task watch items in the blocks.
#
# Open flags for ruling:
#   f1. B2 round 1 (zero-context) is done and REFUTED the first draft-5
#       (index-column anchor; fixed above). The armor chain itself
#       survived rounds 1-3 (no precompute/compute channel found). A
#       confirmatory zero-context round on the de-anchored version is the
#       remaining gate before probes.
#   f2. N1's honest worst case is exactly 8 actions — zero slack; one
#       exploratory read costs the run. That IS the read-restraint axis,
#       but the behavior probe must confirm it doesn't just measure
#       step-arithmetic luck.
#   f3. RESOLVED by the span shape: N4 necessary evidence = 1.75x 4096,
#       inside the ruled 1.5–2x band.
#   f4. N4's residual walks (2-extreme close; disciplined single-slot
#       extreme tracking) are accepted-and-documented rather than closed —
#       closing them is impossible while the check stays stateless and the
#       answer stays a span. Rule: accept with action-log verification
#       duty, or order a different aggregate.

tasks:
  # ══ N1 — ordering / reread decision (capv3-pin-eviction) ═════════════════
  #
  # Shape: the pin file (notes/s9.txt, small, five entries k1..k9) is needed
  # at round 1 (k1) AND round 4 — where WHICH entry (k3/k5/k7/k9) is itself
  # armored, derived at runtime from fallback's correct value. Rounds 2–3
  # each force one fat read from the refs/inv-* pool. By round 4 the pin
  # block has been squeezed out — the pass behavior is going back for it
  # after the dropped marker, by READ (dropped_reread >= 1) or by SEARCH
  # (dropped_research >= 1; the instrument counts both since 42e59da).
  #
  # MERGE NOTE (draft-5, 0807 collision): draft-4's fat lookups were
  # row-keyed (`slot a37` named in the complaint, rows starting with the
  # slot) — the alt session demonstrated a ~32-token `SEARCH a37` fetch
  # against a ~2000-token READ, which zeroes the window pressure on every
  # fat value (all three constructs hurt). draft-5 makes the fat corpora
  # UNIFORM and the operative value POSITIONAL (the file's last line,
  # condition 14) — and, after fresh-eyes round 3, DE-ANCHORED (see the
  # search walk below; the first positional version still leaked position
  # through its index column). The armor
  # chain consequently moves from row selection to FILE selection: the
  # complaint names the file in plaintext at runtime, and which pool file
  # settles round k+1 is cksum-derived from round k's correct value.
  #
  # Needle exemption to condition 14 (deliberate, do not "fix"): the pin
  # entries ARE row-keyed and cheap to re-acquire by SEARCH. The needle is
  # SUPPOSED to be cheap — the measured event is the go-back decision after
  # the dropped marker, not the price of the go-back. dropped_research
  # exists precisely so this recovery is visible.
  #
  # Pressure arithmetic (estimate_tokens = ceil(chars/4), asserted by the
  # generator, not hoped): pool blocks ~2020-2070 incl gate (97-99 rows,
  # pairwise distinct — part of the de-anchoring), edit blocks ~35; every
  # complaint carries a neutral source-of-record clause so each block's
  # gate rider stays fat. Sequential walk-back at the round-4 step, WORST
  # pool pair: ≈ 4168 > 4096 → the pin (s1/s2) is out, dropped marker
  # shown. Margin ~72; the token-shape probe must still confirm
  # evictions.first_step <= 7.
  #
  # Condition 9: honest worst case = R pin, E, R inv_i, E, R inv_j, E,
  # R pin, E = 8 actions exactly (zero slack — flag f2 stands). Best honest
  # case 7 (pin survives; the probe should NOT see that if pressure is right).
  #
  # Condition 11 self-test (all walks written out):
  #   batch walk: s1 READ pin+pool+check.sh. Close at s2? NO — which inv
  #     file settles mirror/fallback and which pin key settles rollback are
  #     cksum-armored; check.sh gives the rule, never the selections. s2 can
  #     only fix `release`. Reading the whole 3-file pool up front is
  #     self-defeating (any two pool blocks + pin + check > 4096, asserted).
  #   compute-channel walk: RUN executes only pre-declared fixed-argv
  #     commands (.orvena/commands.yaml via tools/shell.rs — the model
  #     cannot pass arguments), so cksum cannot be executed on any chosen
  #     input; CRC is not text reasoning either. The chain cannot be
  #     precomputed at any step, by any route.
  #   search walk (rebuilt after fresh-eyes round 3 refuted draft-5's
  #     first version — the slot-#### index column was a cross-file
  #     positional anchor: read one sibling, learn "last line = slot-00NN",
  #     SEARCH it in the others for ~34 tok vs a ~2000-tok READ):
  #     de-anchored corpora carry NO index column (SEARCH matches content,
  #     content no longer encodes position), per-row fields are random (no
  #     position-correlated cycle to learn from a sibling), and pool row
  #     counts are pairwise DISTINCT — a hit's path:line: number cannot be
  #     certified as another file's last line. The only certain selector
  #     for a tail is the tail itself, which presupposes the read; a
  #     catch-all sweep renders dearer than the READ (all four properties
  #     generator-asserted, `deanchored()`). The two fat rounds stay
  #     full-block reads.
  #   stash walk (killed twice in draft-3/4 review, regression-tested):
  #     placeholders are answer-width (12 chars), the byte cap is the solved
  #     size + 4B, and both guards run BEFORE the chain — a stashed file
  #     trips a guard and the guard complaint preempts every round reveal.
  #     Residue: the 1-in-4 single-candidate pre-fill guess into rollback's
  #     own 12 chars is irreducible; probe: a zero-reread pass is a
  #     coin-flip signature, expect ~25% of such runs, classify separately.
  #
  # Expected deaths: fabricated round-4 value (grounding rule catches →
  # burned steps); edit-without-goback after the dropped marker
  # (dropped_reread = 0 AND dropped_research = 0); batch cliff followed by
  # full re-read burn (steps exhaust).

  - id: capv3-pin-eviction
    instruction: "tests/check.sh rejects deploy.conf but reports only the FIRST problem each time it runs. Reference data lives under notes/ and refs/ (read-only). Fix deploy.conf until the check passes. Lines it does not complain about must stay unchanged."
    writes: [deploy.conf]
    verify: "sh tests/check.sh"
    timeout_secs: 30
    seed:
      - path: deploy.conf
        contents: |
          # staging deploy manifest
          release = ------------
          mirror = ------------
          fallback = ------------
          rollback = ------------
          owner = platform
      - path: notes/s9.txt
        contents: |
          # staging pins — rotation 2026-08
          k1 8cwibp5nc3if
          k3 5wd03ysi1ghg
          k5 p82bpr2vwl21
          k7 wieirvhxcrtw
          k9 r2lojxnicpzf
      - path: tests/check.sh
        contents: |
          #!/bin/sh
          f=deploy.conf
          fail() { echo "deploy problem: $1"; exit 1; }
          test "$(wc -c < "$f" | tr -d ' ')" -le 140 || fail "deploy.conf must stay under 140 bytes"
          test "$(wc -l < "$f" | tr -d ' ')" = "6" || fail "deploy.conf must stay exactly 6 lines"
          grep -qxF '# staging deploy manifest' "$f" || fail "an unrelated line changed: header"
          grep -qxF 'owner = platform' "$f" || fail "an unrelated line changed: owner"
          want=$(awk '$1=="k1"{print $2}' notes/s9.txt)
          got=$(sed -n 's/^release = //p' "$f")
          test "$got" = "$want" || fail "release must equal the k1 entry in notes/s9.txt (that file is the source of record for this setting)"
          n=$(printf %s "$got" | cksum | awk '{print $1 % 3 + 1}')
          want=$(tail -n 1 "refs/inv-$n.txt" | awk '{print $NF}')
          got=$(sed -n 's/^mirror = //p' "$f")
          test "$got" = "$want" || fail "mirror must equal the value ending the LAST line of refs/inv-$n.txt (that file is the source of record for this setting)"
          n=$(printf %s "$got" | cksum | awk '{print $1 % 3 + 1}')
          want=$(tail -n 1 "refs/inv-$n.txt" | awk '{print $NF}')
          got=$(sed -n 's/^fallback = //p' "$f")
          test "$got" = "$want" || fail "fallback must equal the value ending the LAST line of refs/inv-$n.txt (that file is the source of record for this setting)"
          n=$(printf %s "$got" | cksum | awk '{print $1 % 4}')
          key=k$((2 * n + 3))
          want=$(awk -v k="$key" '$1==k{print $2}' notes/s9.txt)
          got=$(sed -n 's/^rollback = //p' "$f")
          test "$got" = "$want" || fail "rollback must equal the $key entry in notes/s9.txt (that file is the source of record for this setting)"
          echo ok
