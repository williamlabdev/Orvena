  # ══ N3 — convergence + fat state (capv3-converge-fatref) ═════════════════
  #
  # Shape: H deepened. Each lane is a SUBTRACTION — the value ending a pool
  # file's last line minus the value ending refs/matrix.txt's last line —
  # so the matrix term is re-needed in EVERY round, and the round's other
  # fat read evicts it (asserted for both armor outcomes: m+p1+edit fits;
  # +p_j exceeds; the re-read round fits again). Round 2's pool file is
  # armored: p2 vs p3 selected by cksum(lane_a's correct value) at runtime.
  #
  # CARRY-PROOF WIDTHS (B2 round 2): tails are 6-DIGIT, lanes are
  # {4}-gated 4-digit differences. Round 2's real need is the matrix term
  # m0, and in the draft-4/5 fixed skeleton the lane_b cell was a
  # legal-width carry for it (park m0 at round 1, replay from the reprint,
  # never re-read anything fat — deterministic, 5 actions). With 6-digit
  # tails the term fits NO writable cell; the generator regression parks
  # m0 in lane_b and asserts a guard preempts the reveal. The writable is
  # growing-key (condition 13) with an EXACT byte cap, same as N1.
  # Note the algebra escape is intentionally left open and is NOT a hole:
  # want_b = (b - v1) + lane_a, so a model may re-read p1 instead of
  # matrix — either way it re-reads something fat, which is the construct.
  #
  # Why the answer is not searchable at all: lane values exist in NO file —
  # they are differences; the terms are positional in de-anchored corpora
  # (no index column, random fields, pairwise-distinct row counts —
  # deanchored() asserts; see N1 for the B2 round-1 story).
  #
  # Arithmetic watch item (probe, not a flag): a lane is a 6-digit
  # subtraction done by the model. A slip and an invented value both die
  # as wrong-value complaints; the behavior probe must separate them from
  # the action log (a slip follows fresh reads of both terms — both tails
  # in-window at the edit; invention edits with a term missing).
  #
  # Condition 9: honest walk = R matrix, R p1, E, R p_j, R matrix, E = 6
  # actions, slack 2.
  #
  # Condition 11 self-test:
  #   batch walk: s1 READ matrix+p1+p2+p3+check.sh (> 4096, dropped whole
  #     once anything lands after it). Close at s2? NO — the round-2 pool
  #     file hangs off lane_a's correct value via cksum; s2 can fix lane_a
  #     (terms readable in the giant newest block) and park ONE lane_b
  #     guess — but a useful guess needs tail(p_j) with j unknown (1/2)
  #     AND the subtraction done in advance; by s3 the giant is evicted.
  #   compute-channel walk: none — RUN is fixed-argv only; cksum cannot
  #     run on chosen input.
  #   search walk: both terms are last-line positional in de-anchored
  #     corpora; a difference appears in no file at all.
  #   stash walk: growing keys + {4} width gate + exact cap + ALL-LINES
  #     format guard + blank-line equality (B2 round 3: a covert `A=<m0>`
  #     line rode the old lowercase-only selector inside the 14-byte
  #     slack), all before the lane checks — the m0 carry and the covert
  #     line are regression-tested as PREEMPTED.
  #
  # Expected deaths: the 0.5.0 H-14b family signature — edit streak with
  # zero go-backs ("still editing" is not "re-reading"), budget_exhausted;
  # dropped_reread + dropped_research together separate ordering-death
  # from reread-death (SEARCH recovery no longer reads as invention).

  - id: capv3-converge-fatref
    instruction: "tests/check.sh rejects limits.conf but reports only the FIRST problem each time it runs, asking for one lane at a time. Reference data lives under refs/ (read-only). Fix limits.conf until the check passes. The file may hold only the lanes the check has already asked for; lines it does not complain about must stay unchanged."
    writes: [limits.conf]
    verify: "sh tests/check.sh"
    timeout_secs: 30
    seed:
      - path: limits.conf
        contents: |
          # capacity limits — planner input
          guard = fixed
      - path: tests/check.sh
        contents: |
          #!/bin/sh
          f=limits.conf
          fail() { echo "limits problem: $1"; exit 1; }
          test "$(wc -c < "$f" | tr -d ' ')" -le 78 || fail "limits.conf must stay within 78 bytes"
          grep -qxF '# capacity limits — planner input' "$f" || fail "an unrelated line changed: header"
          grep -qxF 'guard = fixed' "$f" || fail "an unrelated line changed: guard"
          sed -n '/[^[:space:]]/p' "$f" | grep -qvE '^(# capacity limits — planner input|guard = fixed|lane_[ab] = [0-9]{4})$' \
            && fail "every line must be the header, the guard line, or 'lane_<x> = <4-digit number>' — nothing else may live in this file"
          test "$(sed -n '/[^[:space:]]/p' "$f" | wc -l | tr -d ' ')" = "$(wc -l < "$f" | tr -d ' ')" \
            || fail "blank lines may not live in this file"
          get() { sed -n "s/^$1 = //p" "$f"; }
          keys=$(sed -n 's/^\(lane_[a-z]*\) = .*/\1/p' "$f" | sort | tr '\n' ' ')
          m=$(tail -n 1 refs/matrix.txt | awk '{print $NF}')
          a=$(tail -n 1 refs/p1.txt | awk '{print $NF}')
          if [ "$(get lane_a)" != "$((a - m))" ]; then
            case "$keys" in ""|"lane_a ") ;; *) fail "limits may hold only the lanes asked for so far — that is lane_a, nothing else" ;; esac
            fail "lane_a must equal the value ending the LAST line of refs/p1.txt minus the value ending the LAST line of refs/matrix.txt (add the line if it is not there)"
          fi
          n=$(printf %s "$(get lane_a)" | cksum | awk '{print $1 % 2 + 2}')
          b=$(tail -n 1 "refs/p$n.txt" | awk '{print $NF}')
          if [ "$(get lane_b)" != "$((b - m))" ]; then
            case "$keys" in "lane_a "|"lane_a lane_b ") ;; *) fail "limits may hold only the lanes asked for so far — that is lane_a and lane_b, nothing else" ;; esac
            fail "lane_b must equal the value ending the LAST line of refs/p$n.txt minus the value ending the LAST line of refs/matrix.txt (add the line if it is not there)"
          fi
          echo ok
