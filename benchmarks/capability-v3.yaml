  # ══ N4 — sentinel (capv3-sentinel-span) ══════════════════════════════════
  #
  # Designed to read low/zero in BOTH cells on agent 0.5.0 and to flip red
  # the moment the agent learns retention/summarization — v3's E, per
  # ruling iv. Span shape from the alt draft (resolves flag f3: operative
  # evidence = 4 blocks ≈ 1.74x 4096, inside the ruled 1.5–2x band), with
  # an ARMORED FILE SET added in B2 round 2.
  #
  # Why the armor: round 2 refuted the unarmored set outright — all four
  # file names are visible in the first prompt (file_inventory), the check
  # is stateless and tests the final span first, and the step-1 giant
  # block is newest-exempt: READ f1..f4 at s1, write the global span at
  # s2, done in TWO steps with zero window pressure. The sentinel read
  # green for the most natural strategy there is.
  #
  # Mechanism now: refs/f1..f6 exist; the span runs over the four files'
  # SEALED values — each file contributes the closing value of its single
  # agreeing-seals record (draft-7, ruling c 0818; the 0816 probe caught
  # all three N4 deaths computing the span over EVERY value in view, so
  # the anchor had to become a verifiable predicate — see N1) — f1, f2
  # plus TWO cksum-picked files revealed stage by stage (nB =
  # f(span(f1,f2)), nC = f(stage-B span), nC != nB asserted). A batch
  # reader holds six sealed values and still cannot compute the final
  # span — it does not know which four files count. Decoy sealed values
  # are chosen so every candidate stage-B span is distinct (guess floor
  # 1/4, asserted); stage reveals name the picked files in plaintext for
  # the honest walker.
  #
  # Carried value: a SPAN (largest minus smallest) — the running state is
  # a (min,max) PAIR, and the single writable slot is {1,4}-width-gated
  # (plus an exact byte cap), so it carries at most ONE 4-digit number.
  # The alt draft's unbounded [0-9]+ admitted a min·max concat stash
  # through the writable reprint; closed and regression-tested.
  #
  # RESIDUAL WALKS — documented and generator-asserted, not denied:
  #   (i) final-first close: the stateless check still accepts a correct
  #       final span written from nothing — but composing it now requires
  #       knowing BOTH armored picks, i.e. walking the reveals (or a blind
  #       row-pair guess across six files of ~80 uniform records each —
  #       far below the old 1-in-15 tail-pair floor).
  #   (ii) stage-skip: a correct stage-B span draws the f_nC reveal
  #       without stage A ever passing — knowledge of nB is still needed.
  #   (iii) disciplined extreme-tracking with the single 4-digit carry +
  #       eviction-aware ordering can pass in ~7 actions once the picks
  #       are revealed. That IS elite window management — a green cell is
  #       only a reading after action-log verification (which files read,
  #       what interim values written).
  #       FLAG f4, RULED 0816 (william): ACCEPTED AS-IS, with the
  #       action-log verification made an OBLIGATION rather than a
  #       recommendation — every green cell on this task carries the log
  #       check or it is not a reading at all. The aggregate is NOT
  #       changed: the walk is unclosable by construction (a stateless
  #       check whose answer is a span cannot reject a correct span
  #       composed any way), so closing it would mean replacing the span
  #       — the shape the collision ruling put here — and re-deriving the
  #       armor and width-gate arithmetic for a walk that the log already
  #       distinguishes. Recording beats a rewrite when the recording is
  #       mechanical.
  #
  # Expected 0.5.0 deaths (arithmetic, not luck):
  #   JIT walk: every stage beyond A needs a term whose block is gone —
  #     re-read loops burn steps (dropped_reread/research high);
  #   batch walk: ~10.6k giant read is newest-exempt for one step, then
  #     cliff-evicted whole; only stage A is computable from it, and the
  #     stage-B pick is unknowable at that point.
  #   Three operative blocks never coexist (asserted for every triple),
  #   and stage C needs three sealed values at once unless an extreme is carried —
  #   which the slot width fights.
  #
  # Condition 9: a retaining agent solves in 4 READ + 3 EDIT = 7 actions
  # (reveals name the picked files; decoys are never read on the honest
  # walk).
  #
  # Condition 11 self-test: batch close at s2 fails — only stage A is
  # computable from the giant newest block; the picks are cksum-armored.
  # No compute channel (RUN fixed-argv); no search shortcut (de-anchored
  # agreeing-seals records, predicate unsearchable — and the spans
  # themselves appear in no file).
  #
  # Freeze note: reads 0/0 are only meaningful with the probe confirming
  # window_peak_tokens near/over budget and the death shapes above; a zero
  # from parse errors or provider faults is not a sentinel reading. A
  # green is only a reading after action-log verification (residual iii).

  - id: capv3-sentinel-span
    instruction: "tests/check.sh rejects reading.conf but reports only the FIRST problem each time it runs, bringing one more read-only file under refs/ into play at a time; it also runs by itself after every change, so you never need to run it. In each refs/ file exactly one record has two seal codes that agree, and that record's closing value is the value the file contributes. Fix reading.conf until the check passes."
    writes: [reading.conf]
    verify: "sh tests/check.sh"
    timeout_secs: 30
    seed:
      - path: reading.conf
        contents: |
          reading = 0
      - path: tests/check.sh
        contents: |
          #!/bin/sh
          f=reading.conf
          fail() { echo "ledger problem: $1"; exit 1; }
          test "$(wc -c < "$f" | tr -d ' ')" -le 15 || fail "reading.conf must stay within 15 bytes"
          sed -n '/[^[:space:]]/p' "$f" | grep -qvE '^reading = [0-9]{1,4}$' \
            && fail "the file must hold one line, 'reading = <number, at most four digits>' — nothing else may live in it"
          test "$(sed -n '/[^[:space:]]/p' "$f" | wc -l | tr -d ' ')" = "1" \
            || fail "the file must hold one line, 'reading = <number, at most four digits>' — nothing else may live in it"
          v=$(sed -n 's/^reading = //p' "$f")
          t() { awk '$4==$7 {print $NF}' "refs/$1"; }
          span() { printf '%s\n' "$@" | sort -n | awk 'NR==1 { lo = $1 } { hi = $1 } END { print hi - lo }'; }
          a=$(t f1.txt); b=$(t f2.txt)
          sA=$(span "$a" "$b")
          nB=$(printf %s "$sA" | cksum | awk '{print $1 % 4 + 3}')
          c=$(t "f$nB.txt")
          sB=$(span "$a" "$b" "$c")
          nC=$(printf %s "$sB" | cksum | awk '{print $1 % 4 + 3}')
          d=$(t "f$nC.txt")
          test "$v" = "$(span "$a" "$b" "$c" "$d")" && { echo ok; exit 0; }
          test "$v" = "$sB" \
            && fail "reading must now also account for refs/f$nC.txt — largest minus smallest across the agreeing-seals values of f1, f2, f$nB and f$nC"
          test "$v" = "$sA" \
            && fail "reading must now also account for refs/f$nB.txt — largest minus smallest across the agreeing-seals values of f1, f2 and f$nB"
          fail "reading must be the largest minus the smallest of the values ending the agreeing-seals records of refs/f1.txt and refs/f2.txt"
