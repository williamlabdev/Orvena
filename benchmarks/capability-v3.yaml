# Orvena capability v3 — window-management axis.
#
# Status: FROZEN-3 (ruled 0819) — the set is the 3 drafted shapes:
#   capv3-pin-eviction (N1, ordering / re-read / restraint),
#   capv3-converge-fatref (N3, convergence + fat state),
#   capv3-sentinel-span (N4, retention sentinel — reads red in BOTH
#   cells on agent 0.5.0 by design; a green is only a reading after
#   action-log verification, f4 obligation, ruled 0816).
# Freezing was SELECTION + DECLARATION only (no task edited; the corpus
# is byte-identical to the draft-7 probe corpus — editing any task is a
# new set version). Behavior-probe evidence (0819, informal, both cells
# 35b/14b): wrong-row deaths 0/x across all reps; N1 solvable by
# bundle-read (35b) and by retention (14b, 7 steps); N3 3/3 vs 2/3;
# N4 red in both cells via the designed JIT reread-burn mechanism.
# f2 STANDING CONDITION void: floor cell shows a solve and separated
# death shapes. Full material: SLICE-032.
# N2's shape is separately locked by ruling iii and joins as a later
# set version if drafted.
#
# PROVENANCE — the 0807 draft collision and its ruling:
# Two sessions drafted v3 in parallel. draft-4 (0eba93c: armor chain,
# anti-stash width guards, reviewed by verifier x2) and the alt draft
# (9b91b4b: uniform/positional corpora, span sentinel). Each refuted one
# load-bearing claim of the other:
#   * draft-4's hole: complaints named row keys and rows led with them —
#     `SEARCH <key>` fetches any fat value for ~32 tokens vs a ~2000-token
#     READ; the window pressure all three tasks stand on evaporates.
#   * alt's hole: tests/check.sh is readable corpus; with a plaintext
#     field↔source map its condition-11 case collapses, and its N4 format
#     gate (unbounded [0-9]+) admits a min·max concat stash through the
#     writable-reprint channel — the sentinel walks in 6 actions.
# Ruling (0807 late), AS ORIGINALLY WORDED: merge with draft-4 as the
# base, the alt corpus form swapped in, N4 recast as the span sentinel.
# draft-5 was that merge; two zero-context B2 rounds then each refuted a
# load-bearing piece of it — round 1 the slot-index anchor, round 2 the
# fixed-width skeleton itself, N4's unarmored file set, and the invented
# gate format in the window arithmetic. draft-6 carried the fixes; see the
# adversarial trail below. draft-7 (ruling c, 0818) replaces the anchor
# FORM itself after the 0816 behavior probes refuted it corpus-wide (10 of
# 12 deaths wrong-tail): the operative record is no longer the last line
# but the single record per file whose two seal codes agree — a
# self-referential predicate that is verifiable in-window and
# inexpressible as a search pattern (see the corpus bullet below).
#
# RESTATED (0816, william): "draft-4 as the base" no longer describes
# these files and is recorded as A MERGE WITH NO BASE — neither draft is
# the parent. B2 round 2 took the fixed-width skeleton, which was draft-4's
# load-bearing construction, and the writable form here is the alt draft's
# condition-13 growing-key. What survives FROM draft-4 is the armor chain,
# the guard-before-reveal ordering principle, and the mechanical
# verification harness; the corpus form and the writable construction are
# the alt's. The restatement changes no file — it exists so a later
# citation of "draft-4 as the base" cannot read more into the ruling than
# the drafts actually hold.
#
# What every task here shares (mechanism dossier, verified in code 0807):
#
# * Sequential first-problem-only check (H pattern): reveal k+1 exists only
#   after fix k — real state dependency, per design condition 11.
# * UNIFORM / PREDICATE-ANCHORED CORPORA (condition 14; draft-7, ruling c
#   0818): fat records are fixed-shape and every record ends in a
#   same-shape value, but the operative record is the ONE record per file
#   whose two seal codes (the two hex fields) agree — its closing value is
#   the file's operative value. The records stay DE-ANCHORED (fresh-eyes
#   round 3): no index column, per-row fields random, sibling row counts
#   pairwise distinct, anchor positions interior and pairwise distinct.
#   Why this form: the 0816 behavior probes showed the positional anchor
#   ("value = last line") never binds — models operated on mid-file values
#   in 10 of 12 deaths, and a tail offers nothing to verify a pick
#   against, while agreeing codes are a grounded in-window check. Why it
#   is still unsearchable: the driver's engine is the Rust regex crate
#   (grep.rs:11,80) — no backreferences, so the predicate cannot be a
#   pattern; the codes are unknown before a read and each anchor code
#   occurs nowhere else in the task's corpus (sealed() asserts); evicted
#   literals cannot seed a later SEARCH (context is rebuilt per step from
#   instruction + writable + retained evidence, driver.rs:191-218); a
#   catch-all sweep renders dearer than the READ (deanchored (d);
#   MAX_HITS=200 additionally caps multi-file sweeps). N1's pin file is
#   the deliberate exemption (see its block: the needle is SUPPOSED to be
#   cheap to re-acquire; the go-back is the measurement).
# * ARMOR CHAIN (from draft-4, now file-level): which pool file (N1, N3)
#   or which pin key (N1 round 4) settles round k+1 is derived from the
#   CORRECT value of field k via `cksum` at runtime. Why: condition 11's
#   literal self-test kills every plaintext-mapping design — reading
#   check.sh reveals the full map, and the step-1 giant block is still the
#   newest block at step 2 (newest-block exemption), so a one-shot full
#   write closes at step 2 with zero window pressure (v2-H has exactly
#   this property). With the armor the map is not mentally recoverable
#   (CRC is not text reasoning) and no compute channel exists: RUN
#   executes only pre-declared fixed-argv commands (.orvena/commands.yaml,
#   tools/shell.rs). Keys are unknowable until each reveal, and reveals
#   only follow real fixes. Honest walkers never see the armor: each
#   complaint names the file/key in plaintext at runtime.
# * Anti-stash construction (B2 round 2 replaced draft-4's fixed
#   skeleton): writable contents print into the prompt each step
#   (context.rs:56-73) outside the 4096 evidence budget — a free,
#   never-evicted scratchpad unless the task closes it. Fixed
#   answer-width placeholder slots do NOT close it: every not-yet-checked
#   field is a legal-width carry cell (N3's matrix term rode lane_b;
#   N1's whole pool candidate set rode its three free slots — 5 steps,
#   zero fat go-backs, telemetry indistinguishable from a good run).
#   draft-6+ uses GROWING-KEY writables (condition 13's original form):
#   a key line may not exist before the check has asked for it, the keys
#   guard + per-line width regex + EXACT byte cap all run BEFORE the
#   chain, so stash and progress stay mutually exclusive. The lookahead
#   left open is the single just-asked slot (N1: a 1-in-3 pool guess per
#   armored round, action-log visible, generator-asserted). N3 makes the
#   carried term 6-digit against {4}-gated lanes (it fits no cell); N4
#   keeps the {1,4} width gate against the (min,max) pair-carry.
# * Complaints POINT at the source and never quote the expected literal
#   (L-forensics 0807: quoted literals in feedback became the wrong
#   answer; freshness traps are a DIFFERENT axis and must not contaminate
#   these).
# * Fat refs are deliberately under the READ/RUN truncation edge (100
#   lines / 8KB, cap_run_output), so one READ returns the whole file
#   untruncated: N1 pool 97-99 lines / ~8KB ≈ 1990-2030 tok; N3/N4 refs
#   81-84 lines / ~6.9-7.1KB ≈ 1720-1790 tok (counts pairwise distinct
#   per family — part of the de-anchoring).
# * Adversarial review trail: draft-1→4 (verifier x2: print-budget
#   self-blinding refuted; RUN-simulator channel nonexistent; live stash
#   walk through draft-3's cap → answer-width placeholders + solved+4
#   caps, stash walk now a generator regression test). draft-4→5 (the
#   collision review above; the SEARCH-cost bypass and the concat stash
#   are both closed and both regression-tested). draft-5 round 3 (the
#   ruled B2 zero-context attack): REFUTED the first draft-5 — the
#   slot-#### index column was itself a cross-file positional anchor
#   (read one sibling, SEARCH the known last index in the others,
#   17-60x cheaper than the READ; the same class of hole the collision
#   killed draft-4 over, in new clothes). Fixed by de-anchoring (above)
#   + the deanchored() generator regression + explicit >=1000 value
#   invariants (leading-zero shell hazard flagged in the same round).
#   Residue: N1's 1-in-4 single-candidate pre-fill guess is irreducible;
#   N4's residual walks are documented in its block and asserted by the
#   generator. draft-5 round 2 (second zero-context attack, after the
#   de-anchoring): REFUTED three more pieces — (a) N4's unarmored file
#   set: file names are prompt-visible (file_inventory), the check is
#   stateless and tests the final span first, the s1 giant is
#   newest-exempt → read all four, write the global span at s2, sentinel
#   green in two steps (fixed: armored 6-file set, picks cksum-revealed
#   stage by stage); (b) the fixed-width skeleton as a carry channel (see
#   the anti-stash bullet; fixed: growing keys, exact caps, 6-digit N3
#   tails); (c) the window arithmetic's gate format was invented — real
#   gate evidence is "[solved] <task-id>: <complaint>" (driver.rs:481-485)
#   and successful EDITs emit no tool evidence (fixed: driver-faithful
#   reconstruction). draft-6 round 3 (third zero-context attack):
#   REFUTED the round-2 fix itself on N1/N3 — the guard selector
#   `sed -n '/^[a-z]/p'` was blind to any line not starting with a
#   lowercase letter, so a covert `A=<value>` line rode the intermediate
#   byte-cap slack (cap = final size; early rounds leave 14-70 free
#   bytes) and cached the pool tails / the matrix term after all
#   (executed to `ok` by the reviewer). N4 survived on its own pattern —
#   any-non-blank-line selector + zero per-round slack. Fixed by
#   adopting exactly that: EVERY non-blank line must match the enumerated
#   grammar (header / frozen line / key line), and non-blank line count
#   must equal total line count (whitespace-only lines were a residual
#   composition channel inside the slack). Same round: window arithmetic
#   corrected for per-block step headers and the batch block's single
#   gate line. The armor chain has survived all three rounds.
# * All seeds, armor selections and complaint sequences are generated and
#   MECHANICALLY verified by benchmarks/probes/v3-draft-gen/
#   gen_v3_drafts.py: honest walk applied fix-by-fix, complaint order
#   asserted exact, final check asserted `ok`, window arithmetic asserted
#   against the agent estimator (ceil(chars/4)), corpus uniformity
#   asserted, stash/carry/keys/shortcut walks regression-tested.
#
# Telemetry: death classification uses the SLICE-032 instrument
# (evictions / dropped_reread / dropped_research / window_peak_tokens).
# The 0807 instrument gap is CLOSED (42e59da): dropped_research counts
# SEARCH re-acquisition of an evicted path, so a go-back by the route the
# READ truncation note recommends no longer scores as invention.
#
# Probe protocol before any freeze (SLICE-032 calibration section):
#   (i)  token-shape probe: real run per task; require window_peak_tokens
#        near 4096 and evictions.first_step > 0 for N1/N3 (pressure
#        real); if no eviction shows, fatten refs toward the truncation
#        edge (N1 is already at 99 lines — the remaining slack is bytes,
#        not lines).
#   (ii) behavior probe: small n, both cells; death signatures must land
#        in the type-table classes. Per-task watch items in the blocks.
#
# Open flags for ruling:
#   f1. Three zero-context B2 rounds are done; each refuted structural
#       pieces (all fixed in place) while the armor chain itself survived
#       every round — round 2 explicitly recommended ruling it "confirmed
#       information structure" for N1/N3 and extending it to N4, which
#       draft-6 does. The round-3 guard fix passed its confirmation
#       attack (BSD + GNU sed); the trailing no-newline whitespace
#       micro-channel is CLOSED — N1/N3 checks gate on last byte = \n
#       (regression: an unterminated all-space fragment, invisible to
#       both prior gates, is preempted before any reveal).
#   f2. N1's honest worst case is exactly 8 actions — zero slack; one
#       exploratory read costs the run. That IS the read-restraint axis,
#       but the behavior probe must confirm it doesn't just measure
#       step-arithmetic luck.
#   f3. RESOLVED by the span shape: N4 operative evidence = 1.74x 4096,
#       inside the ruled 1.5–2x band.
#   f4. N4's residual walks (final-first close — now requiring the
#       armored picks; disciplined single-slot extreme tracking) are
#       accepted-and-documented rather than closed —
#       closing them is impossible while the check stays stateless and the
#       answer stays a span. Rule: accept with action-log verification
#       duty, or order a different aggregate.

frozen:
  - capv3-pin-eviction
  - capv3-converge-fatref
  - capv3-sentinel-span

tasks:
  # ══ N1 — ordering / reread decision (capv3-pin-eviction) ═════════════════
  #
  # Shape: the pin file (notes/s9.txt, small, five entries k1..k9) is needed
  # at round 1 (k1) AND round 4 — where WHICH entry (k3/k5/k7/k9) is itself
  # armored, derived at runtime from fallback's correct value. Rounds 2–3
  # each force one fat read from the refs/inv-* pool (WHICH pool file is
  # armored too). By round 4 the pin block has been squeezed out — the pass
  # behavior is going back for it after the dropped marker, by READ
  # (dropped_reread >= 1) or by SEARCH (dropped_research >= 1; the
  # instrument counts both since 42e59da).
  #
  # Corpora (condition 14; draft-7, ruling c 0818): fat pool files are
  # UNIFORM and DE-ANCHORED — no index column, per-row random fields,
  # pairwise-distinct row counts. The operative record is no longer
  # positional: the 0816 behavior probes killed "value = last line"
  # outright (10 of 12 deaths across the draft were wrong-tail — armor
  # solved, right file read, value taken from a mid-file row; the
  # positional selector never binds and offers nothing to verify a pick
  # against). Draft-7 selects by SELF-REFERENTIAL PREDICATE: exactly one
  # record per file has two AGREEING seal codes (the two hex fields), and
  # that record's closing value is the operative value. The predicate is
  # verifiable in-window (compare the two codes on the chosen row — a
  # grounded check the tail never offered), unsearchable (see the search
  # walk), and interior at pairwise-distinct positions across the pool
  # (deanchored (e)). The armor still works at FILE level — row-level
  # armor died in the 0807 collision (a complaint that names a row key
  # turns every fat value into a ~32-token SEARCH); naming the PREDICATE
  # in the complaint gives SEARCH nothing, because the predicate is not a
  # pattern.
  #
  # Writable (condition 13, B2 round 2): GROWING-KEY manifest — a field
  # line may not exist before the check has asked for it, and the keys
  # guard runs before every reveal. The draft-4/5 fixed answer-width
  # skeleton was refuted in B2 round 2: its three free 12-char slots were
  # a legal-width stash for the ENTIRE pool candidate set (batch read all
  # three tails at s1, park them in mirror/fallback/rollback, replay from
  # the reprint — 5 steps, zero fat go-backs, telemetry indistinguishable
  # from a good run). Under growing keys that walk trips the keys guard
  # (generator-asserted); the old 1-in-4 pin pre-fill is preempted
  # outright (also asserted). Byte cap is the EXACT solved size — the
  # former +4 slack was itself carry room.
  #
  # Residue (irreducible, action-log visible): the single just-asked slot
  # is a legal lookahead — release fixed + a guessed mirror in the same
  # step still draws the mirror reveal, a 1-in-3 pool guess per armored
  # round (1/9 for both; a wrong guess still forces the fat read).
  # Generator-asserted open. Probe: classify zero-fat-read passes
  # separately; the stash edit is visible in the action log (mirror
  # written before any inv-* read).
  #
  # Needle exemption to condition 14 (deliberate, do not "fix"): the pin
  # entries ARE row-keyed and cheap to re-acquire by SEARCH. The needle is
  # SUPPOSED to be cheap — the measured event is the go-back decision, not
  # its price. dropped_research makes that route visible.
  #
  # Pressure arithmetic (driver-faithful blocks: gate evidence is
  # "[solved] <task-id>: <complaint>", successful EDITs emit no tool
  # evidence — B2 round 2 caught the invented format used before): pool
  # blocks ~2040-2081 incl gate, edit/gate blocks ~46. Worst-pool-pair
  # walk-back at the round-4 step ≈ 4239 > 4096 → the pin is out, dropped
  # marker shown. Margin ~143; the token-shape probe must still confirm
  # evictions.first_step <= 7.
  #
  # Condition 9: honest worst case = R pin, E, R inv_i, E, R inv_j, E,
  # R pin, E = 8 actions exactly (zero slack — flag f2, RULED 0816
  # (william): ACCEPTED, no slack added. Reading restraint is one of the
  # three sub-behaviors this axis measures (ordering / re-read decision /
  # restraint), so a task that punishes a wasted action is measuring the
  # axis, not noise; and slack would cost pressure the task stands on.
  # STANDING CONDITION: if the behavior probe shows the floor cell dying
  # indistinguishably at the ceiling — every death budget_exhausted with
  # no death-shape separation — the flag reopens and slack is added.)
  #
  # Condition 11 self-test:
  #   batch walk: s1 READ pin+pool+check.sh. Close at s2? NO — pool picks
  #     and the round-4 pin key are cksum-armored; check.sh gives the
  #     rule, never the selections; growing keys block parking the
  #     candidates. s2 can fix release and park ONE mirror guess (1/3).
  #   compute-channel walk: RUN executes only pre-declared fixed-argv
  #     commands (bench_commands: a single fixed `check`; tools/shell.rs)
  #     — cksum cannot run on chosen input; CRC is not text reasoning.
  #   search walk: the agreeing-seals predicate is inexpressible in the
  #     driver's search engine — grep.rs (regex crate, no backreferences
  #     or lookaround) cannot say "a row whose 4th and 6th fields match";
  #     the codes themselves are unknown before a read and each anchor
  #     code occurs nowhere else in the corpus (sealed() asserts), so
  #     there is no literal to search for; evicted literals cannot seed a
  #     later SEARCH (the context is rebuilt each step from instruction +
  #     writable + retained evidence only, driver.rs:191-218); catch-all
  #     renders dearer than the READ (deanchored (d)).
  #   stash walk: growing keys + exact byte cap + ALL-LINES format guard
  #     (every non-blank line must be the header, the owner line, or a
  #     legal key line — B2 round 3 executed a covert `A=<tail>` cache
  #     through the old lowercase-only selector) + blank-line equality
  #     (whitespace-only lines were a composition channel in the slack),
  #     all ordered BEFORE the chain. Multi-slot stash, pin pre-fill,
  #     covert lines and blank lines are regression-tested as PREEMPTED.
  #     Residual micro-channels (duplicate frozen lines, key-line order)
  #     carry < 7 bits against 62-bit values — noted, not load-bearing.
  #
  # Expected deaths: fabricated round-4 value (grounding rule catches →
  # burned steps); edit-without-goback after the dropped marker
  # (dropped_reread = 0 AND dropped_research = 0); batch cliff followed by
  # full re-read burn (steps exhaust). Forensic addition after 0816: a
  # value taken from a NON-AGREEING row is the draft-6 wrong-tail death's
  # successor and is now classifiable from the worktree alone (the chosen
  # row's codes differ — the model skipped a verification the corpus
  # affords). If the probe still shows it dominating, that is a reading
  # about predicate binding, not a corpus artifact.

  - id: capv3-pin-eviction
    instruction: "tests/check.sh rejects deploy.conf but reports only the FIRST problem each time it runs, asking for one field at a time; it also runs by itself after every change, so you never need to run it. Reference data lives under notes/ and refs/ (read-only); in each refs/ file exactly one record has two seal codes that agree, and that record's closing value is the file's operative value. Fix deploy.conf until the check passes. The file may hold only the fields the check has already asked for; lines it does not complain about must stay unchanged."
    writes: [deploy.conf]
    verify: "sh tests/check.sh"
    timeout_secs: 30
    seed:
      - path: deploy.conf
        contents: |
          # staging deploy manifest
          owner = platform
      - path: notes/s9.txt
        contents: |
          # staging pins — rotation 2026-08
          k1 518ju0lyebhk
          k3 9trcbmre07mv
          k5 ahtt8s1qirzf
          k7 3px6w2o9afxo
          k9 8ax9w2vsyk05
      - path: tests/check.sh
        contents: |
          #!/bin/sh
          f=deploy.conf
          fail() { echo "deploy problem: $1"; exit 1; }
          test "$(wc -c < "$f" | tr -d ' ')" -le 136 || fail "deploy.conf must stay within 136 bytes"
          grep -qxF '# staging deploy manifest' "$f" || fail "an unrelated line changed: header"
          grep -qxF 'owner = platform' "$f" || fail "an unrelated line changed: owner"
          sed -n '/[^[:space:]]/p' "$f" | grep -qvE '^(# staging deploy manifest|owner = platform|(release|mirror|fallback|rollback) = [a-z0-9]{12})$' \
            && fail "every line must be the header, the owner line, or '<field> = <12-character value>' — nothing else may live in this file"
          test "$(sed -n '/[^[:space:]]/p' "$f" | wc -l | tr -d ' ')" = "$(wc -l < "$f" | tr -d ' ')" \
            || fail "blank lines may not live in this file"
          test "$(tail -c 1 "$f")" = "" || fail "the file must end in a newline — an unterminated final line may not live in this file"
          get() { sed -n "s/^$1 = //p" "$f"; }
          keys=$(sed -n 's/^\([a-z]*\) = .*/\1/p' "$f" | grep -v '^owner$' | sort | tr '\n' ' ')
          want=$(awk '$1=="k1"{print $2}' notes/s9.txt)
          if [ "$(get release)" != "$want" ]; then
            case "$keys" in ""|"release ") ;; *) fail "the manifest may hold only the fields asked for so far — that is release, nothing else" ;; esac
            fail "release must equal the k1 entry in notes/s9.txt (that file is the source of record; add the line if it is not there)"
          fi
          n=$(printf %s "$(get release)" | cksum | awk '{print $1 % 3 + 1}')
          want=$(awk '$4==$6 {print $NF}' "refs/inv-$n.txt")
          if [ "$(get mirror)" != "$want" ]; then
            case "$keys" in "release "|"mirror release ") ;; *) fail "the manifest may hold only the fields asked for so far — that is release and mirror, nothing else" ;; esac
            fail "mirror must equal the value ending the record whose two seal codes agree in refs/inv-$n.txt (that file is the source of record; add the line if it is not there)"
          fi
          n=$(printf %s "$(get mirror)" | cksum | awk '{print $1 % 3 + 1}')
          want=$(awk '$4==$6 {print $NF}' "refs/inv-$n.txt")
          if [ "$(get fallback)" != "$want" ]; then
            case "$keys" in "mirror release "|"fallback mirror release ") ;; *) fail "the manifest may hold only the fields asked for so far — that is release, mirror and fallback, nothing else" ;; esac
            fail "fallback must equal the value ending the record whose two seal codes agree in refs/inv-$n.txt (that file is the source of record; add the line if it is not there)"
          fi
          n=$(printf %s "$(get fallback)" | cksum | awk '{print $1 % 4}')
          key=k$((2 * n + 3))
          want=$(awk -v k="$key" '$1==k{print $2}' notes/s9.txt)
          if [ "$(get rollback)" != "$want" ]; then
            case "$keys" in "fallback mirror release "|"fallback mirror release rollback ") ;; *) fail "the manifest may hold only the fields asked for so far — that is release, mirror, fallback and rollback, nothing else" ;; esac
            fail "rollback must equal the $key entry in notes/s9.txt (that file is the source of record; add the line if it is not there)"
          fi
          echo ok
      - path: refs/inv-1.txt
        contents: |
          ap-south-1  warm   sealed  29dc64  no-exception              193922  fqr9gentwlwn
          ap-south-1  seal   paused  55a33d  drain-scheduled           b7ab56  vb973j0a3wnw
          eu-west-2   warm   paused  1900b4  entitlement-audit         c90b5a  eu7fbiucn0nq
          sa-east-1   drain  ready   b8a866  rotation-verified         a5be53  1r87clgludus
